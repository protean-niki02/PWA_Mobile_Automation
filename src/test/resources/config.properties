# Default test settings. Any key can be overridden on the command line, e.g.
#   mvn test -DbaseUrl=https://marketplace.bimasugam.co.in -Dheadless=true
baseUrl=https://marketplace-uat.bimasugam.co.in
# chromium | firefox | webkit
browser=chromium
headless=false
# UAT is intermittently slow, so navigation gets more time than other actions
navigationTimeoutMs=60000
defaultTimeoutMs=30000

# Evidence saved for every test, pass or fail: <evidenceDir>/<run timestamp>/<test>/
# Kept outside target/ so "mvn clean" doesn't delete it.
evidenceDir=test-evidence
recordVideo=true
recordTrace=true

# The UAT server sometimes never answers a request (fonts, logo, main.dart.js), leaving the
# app on a blank screen. true = re-request the app's static files after 15s (up to 4 tries);
# each retry is logged and the run is flagged "(stall)". false = plain browser behaviour.
retryStalledRequests=true

# ---- Performance & network (every test) ----
# Saved per test: performance.json (page load timings, paints), network.har (all requests -
# open in Chrome DevTools > Network > Import HAR), network-summary.txt (failed / error / slow
# requests); one row per TC per device in <run>/performance-summary.csv.
recordHar=true
# Simulated network speed: none | fast3g | slow3g. Android (Chromium) only - iOS runs unthrottled.
#   mvn test -Dtest=SC01_TC001* -DnetworkProfile=slow3g
networkProfile=none

# ---- Sprint 2 test data: 4 Wheeler journey (UAT) ----
# Car registration number whose details AND previous policy the app fetches completely,
# e.g. MH01AB1234. Tests that need it are SKIPPED while it is empty.
fourWheeler.registrationNumber=KA01MK1244
# Car registration number whose fetched details are INCOMPLETE (used by SC_01_TC_009 and
# SC_01_TC_021). Those two tests are SKIPPED while it is empty.
fourWheeler.incompleteRegistrationNumber=

# ---- Sprint 3 test data: BD2M-761 4 Wheeler - Quotes Listing / Product Comparison ----
# Uses fourWheeler.registrationNumber above for the quotes. Tests needing a value below are
# SKIPPED while it is empty.
# SC_01_TC_008: IDV to type in when the IDV control is a text field (rupees, within the allowed range)
quotes.updatedIdv=
# SC_01_TC_026: registration number of a car no insurer returns quotes for
quotes.noQuotesRegistrationNumber=

# ---- Sprint 2 test data: BD2M-683 Splash Screen ----
# Expected action button labels and the screen each opens (hash route, e.g. /login), from the
# FSD / Figma. Tests that need a value are SKIPPED while it is empty.
# Primary: as in build 2.0.4+8 ("Get Started" opens the login screen) - confirm with the FSD.
splash.primaryButtonLabel=Get Started
splash.primaryButtonRoute=/login
splash.secondaryButtonLabel=
splash.secondaryButtonRoute=
# Where the image grid photos must come from (URL prefix): the CMS. The app also bundles its own
# copies under /assets/assets/images/onboarding/grid_image/ as a fallback. Tests needing it are
# SKIPPED while it is empty.
splash.gridImageSource=https://cms-bucket-uat.bimasugam.co.in/s3fs-public/

# ---- Sprint 3 test data: BD2M-770 Policy Detail Screen -> OVD (My Policies - Policy Details, Mobile) ----
# The tests start as "customer logged in & has an active motor policy & opens a policy card in My Policies".
# Login: a UAT customer with an active motor policy (HDFC ERGO Bima Vahan) and the UAT OTP, which must be a
# fixed one. The tests enter the mobile number, tap Get OTP, type the OTP, then open My Policies and the card.
policies.mobileNumber=
policies.otp=
# Or, instead of logging in: an address that opens My Policies (or Policy Details) directly, e.g. one that
# carries a logged-in session. All BD2M-770 tests are SKIPPED while neither is given.
policyDetails.startUrl=
# Text on the policy card to tap in My Policies (default: HDFC ERGO)
policyDetails.cardText=
